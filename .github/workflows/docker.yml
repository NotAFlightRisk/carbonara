name: 🐋 Docker

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: 🐋 Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to DockerHub
        id: dockerhub
        if: vars.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
          HUB: ${{ vars.DOCKERHUB_USERNAME }}
          PUSHED: ${{ steps.dockerhub.outcome }}
        run: |
          ghcr="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="$ghcr:${TAG#v},$ghcr:latest"
          if [ "$PUSHED" = "success" ]; then
            hub="$(echo "$HUB" | tr '[:upper:]' '[:lower:]')/${GITHUB_REPOSITORY##*/}"
            tags="$tags,$hub:${TAG#v},$hub:latest"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "Pushing: $tags" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
