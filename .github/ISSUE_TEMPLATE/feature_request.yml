name: 💡 Feature Request
description: Suggest an idea or improvement
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please [search existing issues and discussions](https://github.com/NotAFlightRisk/carbonara/issues?q=is%3Aissue) first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's difficult or impossible today?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've tried or thought about.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to work on this?
      description: No obligation - it just helps us plan.
      options:
        - "Yes, I'd like to submit a PR"
        - 'Yes, with some guidance'
        - 'No, just suggesting'
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/NotAFlightRisk/carbonara/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
